; Romeo V2.2 (DFR0225) = ATmega32U4 @ 16 MHz, совместима с Arduino Leonardo
; https://wiki.dfrobot.com/DFR0225
;
; Для clangd в Cursor/VS Code после смены env/зависимостей:
;   python -m platformio run -t compiledb

[env:romeo_v22]
platform = atmelavr
board = leonardo
framework = arduino
build_flags = -DSSD1306_NO_SPLASH
lib_deps =
  arduino-libraries/Servo
  adafruit/Adafruit SSD1306
  adafruit/Adafruit GFX Library

; Скорость USB CDC (Serial) — 115200 по умолчанию в мониторе ниже
monitor_speed = 115200

; Автовыбор COM-порта подключённой платы (при нескольких — укажите вручную)
; upload_port = COM14
; monitor_port = COM14
